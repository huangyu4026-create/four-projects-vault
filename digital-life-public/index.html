<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2efe7" />
  <title>数字生命｜公网今日日志</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <script src="cloud-config.js?v=20260808-status-window"></script>
  <style>
    :root {
      --paper: #f7f1e5;
      --ink: #20201d;
      --muted: #6b6255;
      --line: rgba(32, 32, 29, 0.16);
      --green: #244f38;
      --green-2: #3f7a52;
      --sand: #d8c6a5;
      --clay: #a6593d;
      --white: rgba(255, 252, 245, 0.88);
      --shadow: 0 24px 70px rgba(44, 35, 20, 0.18);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(63, 122, 82, 0.22), transparent 32rem),
        radial-gradient(circle at 88% 4%, rgba(166, 89, 61, 0.16), transparent 26rem),
        linear-gradient(135deg, #f9f2e4 0%, #ede0c9 48%, #d8c6a5 100%);
      padding: env(safe-area-inset-top) 16px 28px;
    }
    .shell { max-width: 760px; margin: 0 auto; padding-top: 18px; }
    .hero {
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 24px 22px;
      background: linear-gradient(160deg, rgba(255,252,245,0.95), rgba(247,241,229,0.74));
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 999px;
      right: -64px;
      top: -72px;
      background: repeating-linear-gradient(35deg, rgba(36,79,56,0.16) 0 7px, transparent 7px 16px);
      opacity: 0.9;
    }
    .eyebrow { letter-spacing: 0.16em; font-size: 12px; color: var(--green); font-weight: 700; }
    h1 { margin: 10px 0 8px; font-size: clamp(30px, 8vw, 56px); line-height: 1.02; font-weight: 800; }
    .lead { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.75; max-width: 35em; }
    .card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      background: var(--white);
      box-shadow: 0 16px 44px rgba(44, 35, 20, 0.10);
    }
    label { display: block; color: var(--muted); font-size: 13px; margin: 0 0 8px; font-weight: 700; }
    input, textarea {
      width: 100%;
      border: 1px solid rgba(32,32,29,0.18);
      border-radius: 18px;
      background: rgba(255,255,255,0.76);
      color: var(--ink);
      font: inherit;
      padding: 14px 15px;
      outline: none;
    }
    textarea { min-height: 240px; resize: vertical; line-height: 1.75; }
    input:focus, textarea:focus { border-color: rgba(36,79,56,0.58); box-shadow: 0 0 0 4px rgba(63,122,82,0.12); }
    .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
    .row { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .actions { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--green), var(--green-2));
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(36,79,56,0.24);
    }
    button.secondary { color: var(--green); background: rgba(36,79,56,0.10); box-shadow: none; }
    button:disabled { opacity: 0.58; cursor: wait; }
    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(216,198,165,0.24);
      color: var(--muted);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; color: var(--muted); background: rgba(255,255,255,0.54); font-size: 12px; }
    .entries { display: grid; gap: 12px; }
    .entry {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 14px;
      background: rgba(255,255,255,0.62);
    }
    .entry strong { display: block; margin-bottom: 6px; }
    .entry small { color: var(--muted); display: block; margin-bottom: 8px; }
    .entry pre { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; font: 14px/1.65 "Songti SC", "STSong", serif; color: #302d28; }
    .entry-progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 0; }
    .entry-progress span { min-height: 52px; display: grid; place-items: center; align-content: center; gap: 3px; border: 1px solid var(--line); border-radius: 14px; color: var(--muted); background: rgba(255,255,255,0.54); font: 700 11px/1.25 system-ui, sans-serif; text-align: center; }
    .entry-progress b { display: block; font-size: 13px; }
    .entry-progress .done { color: var(--green); border-color: rgba(36,79,56,0.34); background: rgba(63,122,82,0.12); }
    .entry-progress .active { color: #72511f; border-color: rgba(166,112,35,0.38); background: rgba(216,198,165,0.30); }
    .entry-progress .problem { color: var(--clay); border-color: rgba(166,89,61,0.38); background: rgba(166,89,61,0.09); }
    .receipt-message { margin: 10px 0 0; color: var(--muted); font: 13px/1.65 system-ui, sans-serif; }
    .result-reader, .source-reader { margin-top: 12px; border: 1px solid rgba(36,79,56,0.24); border-radius: 16px; background: rgba(63,122,82,0.08); overflow: hidden; }
    .result-reader summary, .source-reader summary { padding: 12px 14px; color: var(--green); cursor: pointer; font: 800 13px/1.4 system-ui, sans-serif; }
    .result-body { padding: 0 14px 14px; border-top: 1px solid rgba(36,79,56,0.16); }
    .result-body h3 { margin: 14px 0 8px; font-size: 17px; }
    .result-body pre { margin-top: 0; font-size: 15px; line-height: 1.8; }
    .result-body small { margin-top: 10px; }
    .source-reader { border-color: var(--line); background: rgba(255,255,255,0.38); }
    .source-reader summary { color: var(--muted); font-weight: 700; }
    .config { display: none; }
    .config.open { display: block; }
    .fineprint { color: var(--muted); font-size: 12px; line-height: 1.65; }
    @media (min-width: 720px) {
      body { padding-left: 28px; padding-right: 28px; }
      .row { grid-template-columns: 180px 1fr; align-items: end; }
      .actions { grid-template-columns: 1fr 1fr; }
      .hero { padding: 34px; }
      .card { padding: 22px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="eyebrow">DIGITAL LIFE · TODAY LOG</div>
      <h1>今日日志远程投递口</h1>
      <p class="lead">这里不做复杂分类，也不写 AI 点评。它只把今天的日志安全投递到云端收件箱，等待 Mac 上的数字生命正式工程拉回、入库、深度点评和回显。</p>
      <div class="pill-row">
        <span class="pill">project = digital_life</span>
        <span class="pill">entry_type = today_log</span>
        <span class="pill">source = public_web</span>
      </div>
    </section>

    <form class="card" id="logForm">
      <div class="row">
        <div>
          <label for="logDate">日期</label>
          <input id="logDate" name="date" type="date" required />
        </div>
        <div>
          <label for="logText">今日日志正文</label>
          <textarea id="logText" name="text" placeholder="把今天的日志写在这里。提交后会进入云端收件箱，等待 Mac 数字生命主链拉回处理。" required></textarea>
        </div>
      </div>
      <div class="actions">
        <button id="submitBtn" type="submit">提交今日日志</button>
        <button class="secondary" id="refreshBtn" type="button">查看处理结果</button>
      </div>
      <div class="status" id="statusBox">状态：等待填写。</div>
    </form>

    <section class="card">
      <button class="secondary" id="toggleConfig" type="button">配置云端收件箱</button>
      <div class="config" id="configPanel">
        <p class="fineprint">只填 Google Apps Script Web App 的 /exec 地址和可选口令。不要在这里填 OpenAI API key。</p>
        <div class="grid">
          <div>
            <label for="cloudUrl">云端收件箱 URL</label>
            <input id="cloudUrl" placeholder="https://script.google.com/macros/s/xxxxx/exec" />
          </div>
          <div>
            <label for="cloudToken">口令，可选</label>
            <input id="cloudToken" placeholder="如果 Apps Script 设置了口令，就填这里" />
          </div>
          <button id="saveConfig" type="button">保存到本机浏览器</button>
          <button class="secondary" id="retryOutbox" type="button">重试发送本机暂存</button>
          <button class="secondary" id="clearOutbox" type="button">清空本机暂存</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>最近投递</h2>
      <div class="entries" id="entries"></div>
    </section>
  </main>

  <script>
    const STORE_URL = "digitalLifePublicInboxUrl";
    const STORE_TOKEN = "digitalLifePublicInboxToken";
    const STORE_LOCAL_OUTBOX = "digitalLifePublicLocalOutbox";
    const params = new URLSearchParams(location.search);
    const configuredToken = () => params.get("token") || window.DIGITAL_LIFE_PUBLIC_TOKEN || localStorage.getItem(STORE_TOKEN) || "";
    function isVerifiedRelayUrl(url) {
      return url.hostname === "yu-digital-life.huangyu4026.chatgpt.site" && url.pathname === "/api/public-inbox";
    }
    function sanitizeCloudUrl(raw) {
      try {
        const url = new URL(String(raw || "").trim());
        if (url.protocol !== "https:" && url.protocol !== "http:") return "";
        if (!isVerifiedRelayUrl(url) && !/\/macros\/s\//.test(url.pathname)) return "";
        url.search = "";
        url.hash = "";
        return url.toString().replace(/\/$/, "");
      } catch (_) {
        return "";
      }
    }
    const configuredUrlCandidates = () => {
      const list = [];
      if (params.get("cloud")) list.push(String(params.get("cloud")).trim());
      if (window.DIGITAL_LIFE_PUBLIC_INBOX_URL) list.push(String(window.DIGITAL_LIFE_PUBLIC_INBOX_URL).trim());
      const savedUrl = localStorage.getItem(STORE_URL);
      if (savedUrl) list.push(String(savedUrl).trim());
      const fallbackList = window.DIGITAL_LIFE_PUBLIC_INBOX_URLS;
      if (Array.isArray(fallbackList)) {
        fallbackList.forEach((item) => {
          if (item) list.push(String(item).trim());
        });
      }
      const deduped = [];
      const seen = new Set();
      for (const item of list) {
        const next = sanitizeCloudUrl(item);
        if (next && !seen.has(next)) {
          deduped.push(next);
          seen.add(next);
        }
      }
      return deduped;
    };
    const configuredUrl = () => configuredUrlCandidates()[0] || "";
    const $ = (id) => document.getElementById(id);
    const statusBox = $("statusBox");
    const entriesBox = $("entries");
    const todayLocal = () => {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - offset).toISOString().slice(0, 10);
    };
    $("logDate").value = todayLocal();
    $("cloudUrl").value = configuredUrl();
    $("cloudToken").value = configuredToken();

    function setStatus(text) { statusBox.textContent = text; }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"]/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[ch]));
    }
    function makeId() {
      const randomPart = window.crypto && typeof window.crypto.randomUUID === "function"
        ? window.crypto.randomUUID()
        : `${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
      return `dlp-${Date.now()}-${randomPart}`;
    }
    function readLocalOutbox() {
      try { return JSON.parse(localStorage.getItem(STORE_LOCAL_OUTBOX) || "[]"); } catch (_) { return []; }
    }
    function writeLocalOutbox(items) {
      localStorage.setItem(STORE_LOCAL_OUTBOX, JSON.stringify(items.slice(0, 80)));
    }
    function upsertLocalItem(item) {
      const items = readLocalOutbox().filter((entry) => entry.id !== item.id);
      writeLocalOutbox([item, ...items]);
      return [item, ...items];
    }
    function clearLocalOutbox() {
      localStorage.removeItem(STORE_LOCAL_OUTBOX);
      renderEntries([]);
      setStatus("状态：本机暂存已清空。");
    }
    function renderEntries(items) {
      if (!items || !items.length) {
        entriesBox.innerHTML = "<p class='fineprint'>暂无投递记录。</p>";
        return;
      }
      entriesBox.innerHTML = items.slice(0, 20).map((item) => {
        const result = item.resultText || (item.result && (item.result.ai_response || item.result.summary || item.result.message || item.result.localReceipt || ""));
        const progress = progressForStatus(item.status);
        const updatedAt = item.resultUpdatedAt || item.updatedAt || item.createdAt || "";
        return `<article class="entry">
          <strong>${escapeHtml(item.date || "")}${item.status ? `｜${escapeHtml(statusLabel(item.status))}` : ""}</strong>
          <small>${escapeHtml(item.id || "")}｜更新 ${escapeHtml(updatedAt)}</small>
          <div class="entry-progress" role="list" aria-label="处理进度">
            <span class="${progress.received ? "done" : progress.problem ? "problem" : "active"}" role="listitem"><b>${progress.received ? "✓" : "1"}</b>${progress.received ? "云端已收到" : "等待送达"}</span>
            <span class="${progress.processed ? "done" : progress.processing ? "active" : progress.problem ? "problem" : ""}" role="listitem"><b>${progress.processed ? "✓" : progress.processing ? "…" : "2"}</b>${progress.processed ? "本地已处理" : progress.processing ? "本地处理中" : "等待处理"}</span>
            <span class="${progress.resultReady ? "done" : progress.problem ? "problem" : ""}" role="listitem"><b>${progress.resultReady ? "✓" : progress.problem ? "!" : "3"}</b>${progress.resultReady ? "结果已返回" : progress.problem ? "处理待重试" : "等待结果"}</span>
          </div>
          ${item.message ? `<p class="receipt-message">${escapeHtml(item.message)}</p>` : ""}
          ${result ? `<details class="result-reader" open><summary>处理结果已经返回 · 点此阅读</summary><div class="result-body"><h3>${escapeHtml(item.resultTitle || "每日日志处理结果")}</h3><pre>${escapeHtml(String(result))}</pre>${item.resultUpdatedAt ? `<small>回传时间：${escapeHtml(item.resultUpdatedAt)}</small>` : ""}</div></details>` : ""}
          <details class="source-reader"><summary>查看本条原文</summary><div class="result-body"><pre>${escapeHtml(item.text || "")}</pre></div></details>
        </article>`;
      }).join("");
    }
    function progressForStatus(status) {
      const received = new Set(["forwarding", "pending_local_pull", "saved_waiting_route", "saved_route_retry", "processing", "done", "result_ready", "result_error"]);
      const processing = new Set(["processing", "done"]);
      return {
        received: received.has(status),
        processing: processing.has(status),
        processed: status === "result_ready",
        resultReady: status === "result_ready",
        problem: ["error", "result_error", "local_retry"].includes(status)
      };
    }
    function statusLabel(status) {
      return ({
        pending: "本机暂存·准备补发",
        pending_unverified: "已发出·等待云端确认",
        forwarding: "云端已收到·正在转交",
        pending_local_pull: "云端已收到·等待 Mac 拉取",
        saved_waiting_route: "公网已安全保存",
        saved_route_retry: "公网已保存·等待转交重试",
        processing: "Mac 已拉取处理中",
        done: "Mac 已接收·等待结果回传",
        result_ready: "处理完成·结果已返回",
        result_error: "处理未完成·等待重试",
        error: "处理失败",
        local_only: "本机暂存·等待补发",
        local_retry: "本机暂存·等待重试"
      })[status] || status;
    }
    async function fetchWithTimeout(url, options = {}, timeoutMs = 7000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }
    async function postCloud(body) {
      const urls = configuredUrlCandidates();
      if (!urls.length) throw new Error("尚未配置云端收件箱 URL");
      const token = configuredToken();
      const payload = { token, ...body };
      const payloadText = JSON.stringify(payload);
      let lastErr = null;
      for (const url of urls) {
        try {
          const parsedUrl = new URL(url);
          if (isVerifiedRelayUrl(parsedUrl)) {
            const response = await fetchWithTimeout(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ item: body.item }),
              cache: "no-store"
            }, 15000);
            const data = await response.json();
            if (!response.ok || !data.ok || !data.accepted) {
              throw new Error(data.error || `公网中继投递失败 HTTP ${response.status}`);
            }
            localStorage.setItem(STORE_URL, url);
            return { ...data, transport: "verified", unverified: !data.forwarded };
          }
          let queued = false;
          if (navigator.sendBeacon) {
            queued = navigator.sendBeacon(url, payloadText) || queued;
          }
          fetch(url, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: payloadText,
            cache: "no-store",
            keepalive: true
          }).catch(() => {});
          queued = true;

          // A hidden image request is not subject to CORS response-reading rules.
          // It also gives short and medium-sized logs a second, independently
          // reliable path through Apps Script's existing doGet submit action.
          if (body && String(body.action || "submit") === "submit" && body.item) {
            const submitUrl = new URL(url);
            submitUrl.searchParams.set("action", "submit");
            submitUrl.searchParams.set("item", JSON.stringify(body.item));
            if (token) submitUrl.searchParams.set("token", token);
            if (submitUrl.toString().length <= 60000) {
              const signalImage = document.createElement("img");
              signalImage.alt = "";
              signalImage.setAttribute("aria-hidden", "true");
              signalImage.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
              signalImage.src = submitUrl.toString();
              document.body.appendChild(signalImage);
              setTimeout(() => signalImage.remove(), 60000);
              queued = true;
            }
          }
          if (!queued) throw new Error("浏览器没有接受投递请求");
          localStorage.setItem(STORE_URL, url);
          return { ok: true, transport: "queued", unverified: true };
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("提交失败：所有云端收件箱地址均不可用。");
    }
    async function fetchCloud() {
      const urls = configuredUrlCandidates();
      if (!urls.length) throw new Error("尚未配置云端收件箱 URL");
      const token = configuredToken();
      let lastErr = null;
      for (const url of urls) {
        try {
          const requestUrl = new URL(url);
          requestUrl.searchParams.set("action", "list");
          if (token) requestUrl.searchParams.set("token", token);
          const response = await fetchWithTimeout(requestUrl.toString(), { cache: "no-store" }, 7000);
          if (!response.ok) throw new Error(`云端收件箱读取失败 HTTP ${response.status}`);
          const data = await response.json();
          if (!data.ok) throw new Error(data.error || "读取云端收件箱失败");
          localStorage.setItem(STORE_URL, url);
          if (data.readable === false) return data;
          return data;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("读取失败，所有云端收件箱地址均不可用。");
    }
    async function fetchPublicStatuses(localItems) {
      const relay = configuredUrlCandidates().map((value) => new URL(value)).find(isVerifiedRelayUrl);
      if (!relay) return null;
      const ids = localItems.map((item) => item.id).filter((id) => /^dlp-[A-Za-z0-9._:-]{8,180}$/.test(String(id || ""))).slice(0, 20);
      if (!ids.length) return { ok: true, entries: [] };
      const statusUrl = new URL("/api/public-status", relay.origin);
      const response = await fetchWithTimeout(statusUrl.toString(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids }),
        cache: "no-store"
      }, 9000);
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || `状态读取失败 HTTP ${response.status}`);
      return data;
    }
    function statusSummary(items) {
      const latest = items[0];
      if (!latest) return "状态：入口正常。提交后会在这里显示送达、处理和结果。";
      if (latest.status === "result_ready") return "状态：最新一条已经处理完成，结果已返回手机，可在下方直接阅读。";
      if (["processing", "done"].includes(latest.status)) return "状态：最新一条已被 Mac 收到，正在处理或等待结果回传。页面每 30 秒自动更新。";
      if (["forwarding", "pending_local_pull", "saved_waiting_route", "saved_route_retry"].includes(latest.status)) return "状态：最新一条已安全送达云端，正在等待 Mac 拉取处理。页面每 30 秒自动更新。";
      if (["error", "result_error", "local_retry"].includes(latest.status)) return "状态：最新一条当前需要重试；原文仍保存在手机或公网收件库。";
      return "状态：最新一条正在等待云端确认。页面每 30 秒自动更新。";
    }
    async function flushLocalOutbox({ silent = false } = {}) {
      const items = readLocalOutbox();
      const retryable = new Set(["pending", "pending_unverified", "local_only", "local_retry"]);
      let sent = 0;
      let failed = 0;
      if (!configuredUrl() || !items.some((item) => retryable.has(item.status))) {
        return { sent, failed };
      }
      const nextItems = [];
      for (const item of items) {
        if (!retryable.has(item.status)) {
          nextItems.push(item);
          continue;
        }
        try {
          const normalized = { ...item, status: "pending", updatedAt: new Date().toISOString() };
          const result = await postCloud({ action: "submit", item: normalized });
          sent += 1;
          if (result.unverified) {
            nextItems.push({ ...normalized, status: "pending_unverified", updatedAt: new Date().toISOString() });
          }
        } catch (_) {
          failed += 1;
          nextItems.push({ ...item, status: "local_retry", updatedAt: new Date().toISOString() });
        }
      }
      writeLocalOutbox(nextItems);
      renderEntries(nextItems);
      if (!silent) {
        setStatus(`状态：补发完成。已发出 ${sent} 条，仍在本机等待重试 ${failed} 条。`);
      }
      return { sent, failed };
    }
    async function refreshEntries() {
      try {
        if (!configuredUrl()) {
          const localItems = readLocalOutbox();
          renderEntries(localItems);
          setStatus("状态：云端 URL 未配置。当前只显示本机暂存记录。");
          return;
        }
        const localItems = readLocalOutbox();
        const publicStatuses = await fetchPublicStatuses(localItems);
        if (publicStatuses) {
          const remoteById = new Map((publicStatuses.entries || []).map((entry) => [entry.id, entry]));
          const merged = localItems.map((item) => remoteById.has(item.id) ? { ...item, ...remoteById.get(item.id) } : item);
          writeLocalOutbox(merged);
          renderEntries(merged);
          setStatus(statusSummary(merged));
          return;
        }
        const data = await fetchCloud();
        if (data.readable === false) {
          renderEntries(readLocalOutbox());
          setStatus("状态：公网投递通道正常。本入口采用只写保护，不在手机端读取日志正文。");
          return;
        }
        const items = ((data.state && data.state.items) || []).filter((item) => item.project === "digital_life");
        const cloudIds = new Set(items.map((item) => item.id));
        writeLocalOutbox(readLocalOutbox().filter((item) => !cloudIds.has(item.id)));
        renderEntries(items);
        setStatus(`状态：已读取云端收件箱，共 ${items.length} 条数字生命记录。`);
      } catch (err) {
        const localItems = readLocalOutbox();
        const waiting = localItems.filter((item) => item.status === "pending_unverified").length;
        const retrying = localItems.filter((item) => ["pending", "local_only", "local_retry"].includes(item.status)).length;
        renderEntries(localItems);
        setStatus(`状态：手机暂时不能读取云端回执；投递功能仍可使用。\n已发出待确认 ${waiting} 条，本机待重试 ${retrying} 条；正文仍安全保存在本机。`);
      }
    }
    $("logForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = $("logText").value.trim();
      const date = $("logDate").value || todayLocal();
      if (!text) {
        setStatus("状态：请先填写日志正文。");
        return;
      }
      const item = {
        id: makeId(),
        project: "digital_life",
        entry_type: "today_log",
        source: "public_web",
        date,
        title: `公网今日日志｜${date}`,
        text,
        status: configuredUrl() ? "pending" : "local_only",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };
      $("submitBtn").disabled = true;
      try {
        if (!configuredUrl()) {
          const localItems = upsertLocalItem(item);
          renderEntries(localItems);
          setStatus("状态：尚未配置云端收件箱，本条只保存在当前手机浏览器。配置 URL 后再正式投递。");
        } else {
          const result = await postCloud({ action: "submit", item });
          $("logText").value = "";
          if (result.unverified) {
            const localItems = upsertLocalItem({ ...item, status: "pending_unverified", updatedAt: new Date().toISOString() });
            renderEntries(localItems);
            setStatus("状态：投递请求已经发出。手机暂时读不到云端回执，因此本机保留一份副本，等待下一次同步确认。");
          } else {
            const receipt = result.item || {};
            const localItems = upsertLocalItem({
              ...item,
              status: receipt.status || "pending_local_pull",
              message: receipt.message || "已进入数字生命云收件箱，等待家中 Mac 本地主链拉取。",
              updatedAt: new Date().toISOString()
            });
            renderEntries(localItems);
            setStatus("状态：云端已经收到。下方会持续显示处理进度，完成后直接显示结果。");
            await refreshEntries();
          }
        }
      } catch (err) {
        const localItems = upsertLocalItem({ ...item, status: "local_retry", updatedAt: new Date().toISOString() });
        renderEntries(localItems);
        setStatus(`状态：当前网络没有发出投递，本条已安全暂存在手机，并会自动重试。\n${err.message || err}`);
      } finally {
        $("submitBtn").disabled = false;
      }
    });
    $("refreshBtn").addEventListener("click", refreshEntries);
    $("toggleConfig").addEventListener("click", () => $("configPanel").classList.toggle("open"));
    $("saveConfig").addEventListener("click", () => {
      localStorage.setItem(STORE_URL, sanitizeCloudUrl($("cloudUrl").value.trim()));
      localStorage.setItem(STORE_TOKEN, $("cloudToken").value.trim());
      setStatus("状态：配置已保存在当前浏览器。注意：不要把 OpenAI API key 填在这里。");
      flushLocalOutbox({ silent: true }).then(refreshEntries);
    });
    $("retryOutbox").addEventListener("click", async () => {
      $("retryOutbox").disabled = true;
      try {
        await flushLocalOutbox();
        await refreshEntries();
      } finally {
        $("retryOutbox").disabled = false;
      }
    });
    $("clearOutbox").addEventListener("click", clearLocalOutbox);
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    window.addEventListener("online", () => flushLocalOutbox({ silent: true }).then(refreshEntries));
    window.setInterval(() => {
      if (document.visibilityState === "visible") refreshEntries();
    }, 30000);
    flushLocalOutbox({ silent: true }).then(refreshEntries);
  </script>
</body>
</html>
